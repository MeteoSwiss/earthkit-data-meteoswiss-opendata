[project]
dynamic = ["version"]
name = "earthkit-data-meteoswiss-opendata"
description = "Earthkit-data plugin for accessing NWP MeteoSwiss Open Data."
license = "BSD-3-Clause"
readme = "README.rst"
authors = [
    { name = "Christian Kanesan", email = "christian.kanesan@meteoswiss.ch" },
    { name = "Nina Burgdorfer", email = "nina.burgdorfer@meteoswiss.ch" },
]
requires-python = ">=3.11"
dependencies = [
    "earthkit-data>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "requests>=2.31,<3.0",
]

# Plugin registration so Earthkit can load it with:
# earthkit.data.from_source("meteoswiss-opendata", ...)
[project.entry-points."earthkit.data.sources"]
meteoswiss-opendata = "earthkit_data_meteoswiss_opendata.source:MeteoSwissOpenDataSource"

[dependency-groups]
test = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
lint = [
    "mypy (>=1.18.1,<2.0.0)",
    "pylint (>=3.3.8,<4.0.0)",
    "ruff (>=0.15.15,<0.16.0)",
]
doc = [
    "pydata-sphinx-theme (>=0.16.1,<0.17.0)",
    "sphinx (>=8.2.3,<9.0.0)",
    "sphinx-autoapi (>=3.6.0,<4.0.0)"
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "doc" }
]

[tool.poetry]
requires-poetry = ">=2.0,<3.0"
version = "0.0.0"  # DO NOT SET. The version of the package is always set by the CI/CD pipeline.
include = ["CHANGELOG.rst"]

[tool.pylint.master]
disable = [
    'C0114', # missing-module-docstring
    'C0115', # missing-class-docstring
    'C0116', # missing-function-docstring
    'R0801', # duplications are already covered by SonarQube
    'W0511', # fix me or to-do comments are already covered by SonarQube
]

[tool.pylint.basic]
argument-naming-style = 'any'
attr-naming-style = 'any'
max-args = 8
max-positional-arguments = 8

[tool.pylint.format]
# Maximum number of lines in a module.
max-line-length = 120

[tool.pylint.design]
# Minimum number of public methods for a class (see R0903).
min-public-methods = 0

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "integration: uses the live MeteoSwiss Open Data service",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = pydantic.mypy

[tool.coverage.run]
omit = ["test/**", "doc/**"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
